version: '3.8'

services:
  # Angular Development Server (with hot reloading)
  angular-dev:
    build:
      context: ./src/Taschenrechner.Angular
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./src/Taschenrechner.Angular:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev

  # Angular Production Build
  angular-prod:
    build:
      context: ./src/Taschenrechner.Angular
      dockerfile: Dockerfile
    ports:
      - "8080:4200"
    profiles:
      - prod

  # Optional: Node.js service for API (if you want to add it later)
  # api:
  #   build:
  #     context: ./src/Taschenrechner.API
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=development
